backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news"
    label: "समाचार / पोष्ट"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "समाचारको शीर्षक", name: "title", widget: "string"}
      - {label: "मिती", name: "date", widget: "datetime"}
      - {label: "मुख्य फोटो", name: "image", widget: "image", required: false}
      - {label: "समाचार विवरण", name: "body", widget: "markdown"}
      
